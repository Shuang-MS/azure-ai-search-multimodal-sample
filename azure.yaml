name: aisearch-multimodal-rag-demo
metadata:
  template: azd-init@1.14.0
services:
  backend:
    project: ./src/backend
    language: py
    host: appservice
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: ..\..\scripts\build-frontend.ps1
          interactive: false
          continueOnError: false
        posix:
          shell: sh
          run: ../../scripts/build-frontend.sh
          interactive: false
          continueOnError: false
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/prepdocs.ps1 --IndexerStartegy indexer-image-verbal
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/prepdocs.sh indexer-image-verbal
      interactive: true
      continueOnError: false